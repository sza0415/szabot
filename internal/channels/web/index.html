<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>szabot</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #262b36;
    --text: #e6e8ee;
    --muted: #8b93a7;
    --accent: #4f7cff;
    --user-bubble: #2b4bb3;
    --bot-bubble: #1e222b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
  }
  header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #3ad07a; box-shadow: 0 0 8px #3ad07a;
  }
  header .dot.off { background: #d0603a; box-shadow: none; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .status { font-size: 12px; color: var(--muted); margin-left: auto; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }

  .msg { display: flex; margin-bottom: 18px; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 76%;
    padding: 11px 14px;
    border-radius: 14px;
    line-height: 1.55;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .role {
    font-size: 11px; color: var(--muted);
    margin: 0 4px 4px; align-self: flex-end;
  }
  .msg.bot .role { align-self: flex-start; }
  .bubble.pending::after {
    content: "▋";
    animation: blink 1s steps(2) infinite;
    color: var(--muted);
  }
  @keyframes blink { 50% { opacity: 0; } }

  footer {
    border-top: 1px solid var(--border);
    background: var(--panel);
    padding: 14px 0;
  }
  .composer {
    max-width: 760px; margin: 0 auto; padding: 0 20px;
    display: flex; gap: 10px; align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14.5px;
    font-family: inherit;
    line-height: 1.5;
    max-height: 160px;
    outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 11px 20px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    height: 44px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="statusDot"></span>
    <h1>szabot</h1>
    <span class="status" id="status">连接中…</span>
  </header>

  <div id="messages"><div class="wrap" id="list"></div></div>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="给 szabot 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="send">发送</button>
    </div>
    <div class="hint">Enter 发送 · Shift+Enter 换行</div>
  </footer>

<script>
(function () {
  const list = document.getElementById("list");
  const messages = document.getElementById("messages");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const statusDot = document.getElementById("statusDot");

  // 会话 ID：优先用 localStorage 里保存的，保证刷新后延续同一 session。
  let session = localStorage.getItem("szabot_session");
  if (!session) {
    session = "web:" + Date.now() + ":" + Math.random().toString(36).slice(2, 8);
    localStorage.setItem("szabot_session", session);
  }

  let currentBotBubble = null; // 本轮正在接收流式增量的气泡
  let waiting = false;         // 是否在等待回复（禁用发送）

  function setStatus(text, online) {
    statusEl.textContent = text;
    statusDot.classList.toggle("off", !online);
  }

  function scrollToBottom() {
    messages.scrollTop = messages.scrollHeight;
  }

  function addMessage(role, text) {
    const msg = document.createElement("div");
    msg.className = "msg " + role;
    const roleEl = document.createElement("div");
    roleEl.className = "role";
    roleEl.textContent = role === "user" ? "你" : "szabot";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    if (role === "user") {
      msg.appendChild(bubble);
    } else {
      msg.appendChild(roleEl);
      msg.appendChild(bubble);
    }
    list.appendChild(msg);
    scrollToBottom();
    return bubble;
  }

  // 建立 SSE 连接，接收流式回复。
  function connect() {
    const es = new EventSource("/api/stream?session=" + encodeURIComponent(session));

    es.addEventListener("ready", function () {
      setStatus("已连接", true);
    });

    es.onmessage = function (e) {
      let data;
      try { data = JSON.parse(e.data); } catch (_) { return; }

      if (data.delta && data.text) {
        // 流式增量：追加到当前气泡。
        if (!currentBotBubble) {
          currentBotBubble = addMessage("bot", "");
          currentBotBubble.classList.add("pending");
        }
        currentBotBubble.textContent += data.text;
        scrollToBottom();
      } else if (data.done) {
        // 收尾：结束本轮，解锁输入。
        if (currentBotBubble) currentBotBubble.classList.remove("pending");
        currentBotBubble = null;
        waiting = false;
        sendBtn.disabled = false;
      } else if (data.text) {
        // 非流式整段回复（向后兼容）。
        if (currentBotBubble) {
          currentBotBubble.textContent += data.text;
        } else {
          addMessage("bot", data.text);
        }
      }
    };

    es.onerror = function () {
      setStatus("连接断开，重连中…", false);
      // EventSource 会自动重连，这里只更新状态。
    };
  }

  async function send() {
    const text = input.value.trim();
    if (!text || waiting) return;

    addMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    waiting = true;
    sendBtn.disabled = true;

    try {
      const resp = await fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: session, text: text }),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
    } catch (err) {
      addMessage("bot", "发送失败：" + err.message);
      waiting = false;
      sendBtn.disabled = false;
    }
  }

  // 自适应高度。
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  });

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  sendBtn.addEventListener("click", send);

  connect();
  input.focus();
})();
</script>
</body>
</html>
